[project]
name = "crouch-detection"
version = "1.0.0"
description = "Webcam crouch detection -> keyboard input. Play Time Crisis (MAME) by physically crouching."
requires-python = ">=3.9,<3.13"
dependencies = [
    "opencv-python>=4.9",
    "mediapipe>=0.10.14",
    "numpy",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
crouch-detection = "crouch_detection.main:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
